<!doctype html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clinic Management || Login | Signup</title>
    <link rel="stylesheet" href="./Styles/main.css" />
    <link rel="shortcut icon" href="img/Mehr-Icon.png" type="image/x-icon" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/persian-datepicker@1.2.0/dist/css/persian-datepicker.min.css"
    />
    <link rel="stylesheet" href="./Styles/persian-datepicker.min.css" />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.15.12/dist/cdn.min.js"
    ></script>
  </head>
  <body>
    <div
      class="auth-page"
      x-data="{
    activeTab: 'login',
    showPassword: false
  }"
    >
      <div class="auth-card">
        <!-- Logo -->
        <div class="auth-logo">
          <div class="logo-icon">🦷</div>

          <div class="logo-text">
            <h1>مهر</h1>
            <span>کلینیک دندانپزشکی</span>
          </div>
        </div>

        <!-- Tabs -->
        <div class="auth-tabs">
          <button
            class="auth-tab active"
            :class="{ 'active': activeTab === 'login' }"
            @click="activeTab = 'login'"
          >
            ورود
          </button>

          <button
            class="auth-tab"
            :class="{ 'active': activeTab === 'signup' }"
            @click="activeTab = 'signup'"
          >
            ثبت نام
          </button>
        </div>

        <!-- Login Form -->
        <form class="auth-form" x-show="activeTab === 'login'" x-transition>
          <!-- National Code -->
          <div class="form-group">
            <label for="national-code"> شماره موبایل یا ایمیل </label>

            <div class="input-wrapper">
              <span class="input-icon"
                ><svg
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="#6b7280"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <g clip-path="url(#clip0_3111_32711)">
                    <path
                      d="M12 12.75C8.83 12.75 6.25 10.17 6.25 7C6.25 3.83 8.83 1.25 12 1.25C15.17 1.25 17.75 3.83 17.75 7C17.75 10.17 15.17 12.75 12 12.75ZM12 2.75C9.66 2.75 7.75 4.66 7.75 7C7.75 9.34 9.66 11.25 12 11.25C14.34 11.25 16.25 9.34 16.25 7C16.25 4.66 14.34 2.75 12 2.75Z"
                    />
                    <path
                      d="M20.5901 22.75C20.1801 22.75 19.8401 22.41 19.8401 22C19.8401 18.55 16.3202 15.75 12.0002 15.75C7.68015 15.75 4.16016 18.55 4.16016 22C4.16016 22.41 3.82016 22.75 3.41016 22.75C3.00016 22.75 2.66016 22.41 2.66016 22C2.66016 17.73 6.85015 14.25 12.0002 14.25C17.1502 14.25 21.3401 17.73 21.3401 22C21.3401 22.41 21.0001 22.75 20.5901 22.75Z"
                    />
                  </g>
                  <defs>
                    <clipPath id="clip0_3111_32711">
                      <rect width="24" height="24" fill="white" />
                    </clipPath>
                  </defs></svg
              ></span>

              <input
                type="text"
                id="national-code"
                placeholder="شماره موبایل یا ایمیل"
              />
            </div>
          </div>

          <!-- Password -->
          <div class="form-group">
            <label for="password"> رمز عبور </label>

            <div class="input-wrapper">
              <button
                type="button"
                class="input-icon password-toggle"
                @click="showPassword = !showPassword"
              >
                <svg
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <g clip-path="url(#clip0_4418_9532)">
                    <path
                      d="M15.58 11.9999C15.58 13.9799 13.98 15.5799 12 15.5799C10.02 15.5799 8.42004 13.9799 8.42004 11.9999C8.42004 10.0199 10.02 8.41992 12 8.41992C13.98 8.41992 15.58 10.0199 15.58 11.9999Z"
                      stroke="#ffffff"
                      stroke-width="1.5"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                    <path
                      d="M12 20.2707C15.53 20.2707 18.82 18.1907 21.11 14.5907C22.01 13.1807 22.01 10.8107 21.11 9.4007C18.82 5.8007 15.53 3.7207 12 3.7207C8.46997 3.7207 5.17997 5.8007 2.88997 9.4007C1.98997 10.8107 1.98997 13.1807 2.88997 14.5907C5.17997 18.1907 8.46997 20.2707 12 20.2707Z"
                      stroke="#ffffff"
                      stroke-width="1.5"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                  </g>
                  <defs>
                    <clipPath id="clip0_4418_9532">
                      <rect width="24" height="24" fill="none" />
                    </clipPath>
                  </defs>
                </svg>
              </button>

              <input
                :type="showPassword ? 'text' : 'password'"
                id="password"
                placeholder="رمز عبور"
              />
            </div>
          </div>

          <!-- Remember -->
          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox" />
              <span>مرا به خاطر بسپار</span>
            </label>

            <a href="#" class="forgot-password"> فراموشی رمز عبور </a>
          </div>

          <!-- Submit -->
          <button type="submit" class="auth-submit">ورود</button>
        </form>
      </div>
    </div>
  </body>
</html>
